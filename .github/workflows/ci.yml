name: CI — Diabetes Risk Prediction Phase 2

on:
  push:
    branches: [main, phase2]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt httpx pytest

      - name: Run model unit tests
        run: pytest tests/test_model.py -v --tb=short

      - name: Run API unit tests
        run: pytest tests/test_api.py -v --tb=short

  lint:
    name: Lint with flake8
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Lint app.py and api.py
        run: flake8 app.py api.py --max-line-length=120 --ignore=E501,W503
